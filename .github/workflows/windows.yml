name: NOMIKO Windows build and signed release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip

      - name: Verify NOMIKO source is present
        shell: pwsh
        run: |
          foreach ($file in @('main.py', 'requirements.txt', 'src/update_trust.py', 'tools/sign_release.py', 'installer/NOMIKO.nsi', 'update_helper.py')) {
            if (-not (Test-Path $file)) { throw "Source file missing: $file. Upload the NOMIKO v0.9.0 source files before building." }
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate Windows icon assets
        shell: pwsh
        run: |
          python tools/generate_icons.py
          if (!(Test-Path assets/NOMIKO.ico)) { throw 'Icon creation failed' }

      - name: Run offline tests
        shell: pwsh
        run: python -m unittest discover -s tests -q

      - name: Build NOMIKO
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name NOMIKO --icon assets/NOMIKO.ico --add-data 'assets/NOMIKO.ico;assets' --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets --collect-all cryptography main.py

      - name: Build independent update helper
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NOMIKO-UpdateHelper --icon assets/NOMIKO.ico --distpath helper-dist update_helper.py
          Copy-Item helper-dist\NOMIKO-UpdateHelper.exe dist\NOMIKO\NOMIKO-UpdateHelper.exe

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' installer\NOMIKO.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer failed." }
          $found = Get-ChildItem -Path . -Recurse -File -Filter 'NOMIKO-Setup-0.9.1-alpha.exe' | Select-Object -First 1
          if (-not $found) { throw "Installer was not generated." }
          $target = Join-Path (Get-Location).Path 'NOMIKO-Setup-0.9.1-alpha.exe'
          if ($found.FullName -ne $target) { Copy-Item -LiteralPath $found.FullName -Destination $target -Force }

      - name: Build portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\NOMIKO\* -DestinationPath NOMIKO-Windows-portable.zip -CompressionLevel Optimal

      - name: Upload unsigned CI build for Windows smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: nomiko-windows-test-build
          path: |
            NOMIKO-Windows-portable.zip
            NOMIKO-Setup-*.exe

      - name: Check explicit signed release request
        id: gate
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c 'from src.update_trust import CURRENT_VERSION; print(CURRENT_VERSION)'
          $tag = "v$version-alpha"
          if (!(Test-Path '.github/release-request.txt')) {
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $request = (Get-Content '.github/release-request.txt' -Raw).Trim()
          if ($request -ne "PUBLISH $tag") { throw "Release request '$request' does not match $tag" }
          gh release view $tag --repo '${{ github.repository }}' --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            'publish=false' >> $env:GITHUB_OUTPUT
            Write-Host "Already released: $tag"
          } else {
            'publish=true' >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          }

      - name: Sign update manifest
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          NOMIKO_SIGNING_KEY_B64: ${{ secrets.NOMIKO_SIGNING_KEY_B64 }}
        run: |
          if (-not $env:NOMIKO_SIGNING_KEY_B64) { throw 'NOMIKO_SIGNING_KEY_B64 is missing' }
          $version = '${{ steps.gate.outputs.version }}'
          python tools/sign_release.py --version $version --channel alpha --installer "NOMIKO-Setup-$version-alpha.exe" --out release --notes 'NOMIKO desktop and taskbar icon; Windows desktop shortcut; signed automatic updates.'
          if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }

      - name: Publish signed GitHub Release
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.gate.outputs.tag }}'
          $version = '${{ steps.gate.outputs.version }}'
          gh release create $tag "NOMIKO-Setup-$version-alpha.exe" NOMIKO-Windows-portable.zip release/update.json release/update.sig --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "NOMIKO $version Alpha" --notes 'Desktop shortcut, Windows icons, signed GitHub update manifest. Experimental alpha; no Authenticode code signature.' --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
